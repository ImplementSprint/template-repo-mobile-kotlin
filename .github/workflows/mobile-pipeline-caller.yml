# ──────────────────────────────────────────────────────────────
# Mobile Pipeline Caller (unified)
# Copy this file into the target repo at:
#   .github/workflows/master-pipeline-mobile.yml
#
# Works for Expo + TypeScript, Kotlin/Android, and mixed repos.
# Also used by MB (micro-backend) repositories.
# The pipeline_mode input controls which SYSTEMS_JSON variable
# is read (auto = picks multi if available, else single).
#
# ── Required repository variables ──────────────────────────────
# Set MOBILE_SINGLE_SYSTEMS_JSON (or MOBILE_MULTI_SYSTEMS_JSON)
# as a repository variable.
#
# Minimal config (all other fields have sensible defaults):
#
# { "name": "MyApp-Mobile", "dir": ".", "mobile_stack": "expo" }
#
# Optional overrides (showing defaults):
#   enable_android_build: true   — Local Android build (Detox debug APK)
#   enable_ios_build: true       — Local iOS simulator build (Detox debug .app)
#   enable_lint: true
#   enable_security_scan: true
#   coverage_threshold: 80
#
# Expo systems must be TypeScript-based:
#   tsconfig.json + strict mode
# Builds are local (xcodebuild / Gradle) — no EAS or EXPO_TOKEN needed.
# Detox E2E tests consume build artifacts from the build stage.
# SonarCloud runs once at the master mobile pipeline level, and Detox
# runs by default for Expo systems.
# ──────────────────────────────────────────────────────────────
name: "Master Pipeline — Mobile"

on:
  push:
    branches: [test, uat, main]
  pull_request:
    branches: [test, uat, main]
  workflow_dispatch:
    inputs:
      pipeline_mode:
        description: "Pipeline mode (auto|single|multi)"
        type: choice
        options: [auto, single, multi]
        default: auto
      enable_lint:
        description: "Run lint checks"
        type: boolean
        default: true
      enable_security_scan:
        description: "Run security scan"
        type: boolean
        default: true
      enable_sonar:
        description: "Run SonarCloud analysis"
        type: boolean
        default: true
      enable_grafana_k6:
        description: "Run Grafana k6 cloud checks"
        type: boolean
        default: false
      k6_script_path:
        description: "Path to k6 script or performance tests directory"
        type: string
        default: "tests/performance"
      k6_base_url:
        description: "Optional base URL for k6"
        type: string
        default: ""
      k6_run_only_on_branch:
        description: "Branch allowed for k6 execution"
        type: string
        default: "test,uat,main"
      run_deploy:
        description: "Run deploy jobs (main only)"
        type: boolean
        default: false
      run_promotion:
        description: "Run PR promotion jobs"
        type: boolean
        default: true
      dry_run:
        description: "Preview-only mode (skip version tag push)"
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write
  packages: write
  security-events: write

jobs:
  kotest-tests:
    name: Kotest Tests
    runs-on: ubuntu-latest
    env:
      RUN_FULL_QUALITY: ${{ github.ref_name == 'test' || github.base_ref == 'test' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0"

      - name: Export Android SDK variables
        shell: bash
        run: |
          if [ -n "${ANDROID_HOME}" ]; then
            echo "ANDROID_HOME=${ANDROID_HOME}" >> "$GITHUB_ENV"
            echo "ANDROID_SDK_ROOT=${ANDROID_HOME}" >> "$GITHUB_ENV"
          elif [ -n "${ANDROID_SDK_ROOT}" ]; then
            echo "ANDROID_HOME=${ANDROID_SDK_ROOT}" >> "$GITHUB_ENV"
            echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT}" >> "$GITHUB_ENV"
          else
            echo "ANDROID_HOME and ANDROID_SDK_ROOT are not set" >&2
            exit 1
          fi

      - name: Run full Kotest suite (test branch)
        if: ${{ env.RUN_FULL_QUALITY == 'true' }}
        run: |
          chmod +x ./gradlew
          ./gradlew test --no-daemon --warning-mode all

      - name: Run smoke Kotest check (uat/main)
        if: ${{ env.RUN_FULL_QUALITY != 'true' }}
        run: |
          chmod +x ./gradlew
          ./gradlew :app:testDebugUnitTest --tests "com.implementsprint.mobile.SampleKotestSpec" --no-daemon --warning-mode all

  trivy-security-scan:
    name: Trivy Security Scan
    runs-on: ubuntu-latest
    env:
      RUN_FULL_QUALITY: ${{ github.ref_name == 'test' || github.base_ref == 'test' }}

    steps:
      - name: Checkout code
        if: ${{ env.RUN_FULL_QUALITY == 'true' && (github.event_name != 'workflow_dispatch' || fromJSON(github.event.inputs.enable_security_scan || 'true')) }}
        uses: actions/checkout@v4

      - name: Run Trivy vulnerability scan (test branch)
        if: ${{ env.RUN_FULL_QUALITY == 'true' && (github.event_name != 'workflow_dispatch' || fromJSON(github.event.inputs.enable_security_scan || 'true')) }}
        uses: aquasecurity/trivy-action@v0.35.0
        with:
          scan-type: fs
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          format: sarif
          output: trivy-results.sarif
          exit-code: '1'

      - name: Upload Trivy SARIF report
        if: ${{ env.RUN_FULL_QUALITY == 'true' && (github.event_name != 'workflow_dispatch' || fromJSON(github.event.inputs.enable_security_scan || 'true')) && always() }}
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results.sarif

      - name: Security scan skipped outside test branch
        if: ${{ env.RUN_FULL_QUALITY != 'true' || (github.event_name == 'workflow_dispatch' && !fromJSON(github.event.inputs.enable_security_scan || 'true')) }}
        run: echo "Trivy scan skipped (non-test branch flow or manually disabled)."

  call-orchestrator:
    if: ${{ github.ref_name != 'test' && github.base_ref != 'test' }}
    needs: [kotest-tests, trivy-security-scan]
    uses: ImplementSprint/central-workflow/.github/workflows/master-pipeline-mobile.yml@main
    with:
      pipeline_mode: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.pipeline_mode || 'auto' }}
      enable_lint: ${{ github.event_name == 'workflow_dispatch' && fromJSON(github.event.inputs.enable_lint || 'true') || true }}
      enable_security_scan: false
      enable_sonar: true
      enable_governance: false
      enable_grafana_k6: ${{ github.event_name == 'workflow_dispatch' && fromJSON(github.event.inputs.enable_grafana_k6 || 'false') || false }}
      k6_script_path: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.k6_script_path || 'tests/performance' }}
      k6_base_url: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.k6_base_url || '' }}
      k6_run_only_on_branch: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.k6_run_only_on_branch || 'test,uat,main' }}
      run_deploy: ${{ github.ref_name == 'main' && (github.event_name != 'workflow_dispatch' || fromJSON(github.event.inputs.run_deploy || 'false')) }}
      run_promotion: ${{ github.event_name == 'workflow_dispatch' && fromJSON(github.event.inputs.run_promotion || 'true') || github.event_name == 'push' }}
      dry_run: ${{ github.event_name == 'workflow_dispatch' && fromJSON(github.event.inputs.dry_run || 'false') || false }}
    secrets: inherit
